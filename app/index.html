ACOES.chamada = function () {
  var b = $('cham-btn');
  if (S.chamada) { S.chamada = false; try { if (S.rec) S.rec.stop(); speechSynthesis.cancel(); } catch (e) {} chamEstado('Chamada pausada'); b.textContent = '📞 Retomar chamada'; return; }
  S.chamada = true; S.silencios = 0; S.erroMic = '';
  b.textContent = '📴 Pausar chamada';
  var ini = S.pre; S.pre = '';
  if (ini) { chamEnviar(ini, false); return; }
  falar(S.sala.abertura, 'en-US', chamOuvir);
  chamEstado('Nice AI falando...', 'na-falando');
};

function chamOuvir() {
  if (!S.chamada || S.proc || !S.sala) return;
  chamEstado('Ouvindo você...', 'na-ouvindo');
  var recebeu = false;
  S.erroMic = '';
  var ok = ouvirVoz($('cham-lang').value, function (t) { recebeu = true; S.silencios = 0; chamEnviar(t, false); }, function () {
    if (recebeu || !S.chamada || S.proc) return;
    if (S.erroMic && S.erroMic !== 'no-speech' && S.erroMic !== 'aborted') { S.chamada = false; chamEstado('Microfone indisponível. Use o texto abaixo.'); $('cham-btn').textContent = '📞 Tentar de novo'; return; }
    S.silencios++;
    if (S.silencios >= 2) { S.silencios = 0; chamEnviar('', true); } else chamOuvir();
  });
  if (!ok) { S.chamada = false; chamEstado('Use o texto abaixo.'); }
}

function chamEnviar(texto, travou) {
  var s = S.sala;
  if (!s || S.proc) return;
  S.proc = true;
  var eu = $('cham-eu');
  if (eu) eu.textContent = travou ? 'Você: (silêncio)' : 'Você: ' + texto;
  chamEstado('Nice AI pensando...');
  api('sessao.enviar', { sessaoId: s.id, texto: texto || '...', travou: travou }).then(function (r) {
    var leg = $('cham-leg');
    if (leg) leg.innerHTML = fmtTexto(r.resposta) + (r.correcoes || []).map(function (c) { return '<div class="na-corr"><s>' + h(c.original) + '</s> &rarr; <b>' + h(c.corrigido) + '</b><br><small>' + h(c.explicacao) + '</small></div>'; }).join('') + (r.nota > 0 ? '<p class="na-mut" style="margin:6px 0 0">Nota: ' + r.nota + '/100</p>' : '');
    S.proc = false;
    if (!S.chamada) { chamEstado('Resposta recebida'); return; }
    chamEstado('Nice AI falando...', 'na-falando');
    falar(r.resposta, r.idioma === 'pt' ? 'pt-BR' : 'en-US', chamOuvir);
  }).catch(function (e) { S.proc = false; toast(e.message); chamEstado('Erro: ' + e.message); S.chamada = false; var b = $('cham-btn'); if (b) b.textContent = '📞 Tentar de novo'; });
}

T.jogos = function (tipo) {

function jogoMatch(g) {
  var en = g.pares.map(function (p) { return p.en; }), pt = g.pares.map(function (p) { return p.pt; }).sort(function () { return Math.random() - 0.5; });
  S.jogo = { sel: null, acertos: 0, total: g.pares.length, pares: g.pares, erros: 0 };
  var html = '<h1>Word Match</h1><p class="na-mut">Toque na palavra em inglês e depois na tradução.</p><div class="na-card"><div class="na-par"><div class="na-forum">' + en.map(function (w) { return '<button class="na-peca" data-act="matchEn" data-v="' + h(w) + '">' + h(w) + '</button>'; }).join('') + '</div><div class="na-forum">' + pt.map(function (w) { return '<button class="na-peca" data-act="matchPt" data-v="' + h(w) + '">' + h(w) + '</button>'; }).join('') + '</div></div><p id="jogo-res"></p></div><button class="na-btn na-claro" data-go="inicio">Voltar</button>';
  pintar(html);
}
ACOES.matchEn = function (el) {
  if (el.classList.contains('na-certa')) return;
  var ant = document.querySelector('[data-act=matchEn].na-sel'); if (ant) ant.classList.remove('na-sel');
  el.classList.add('na-sel'); S.jogo.sel = el;
};
ACOES.matchPt = function (el) {
  var j = S.jogo;
  if (!j.sel || el.classList.contains('na-certa')) return;
  var par = j.pares.filter(function (p) { return p.en === j.sel.getAttribute('data-v'); })[0];
  if (par && par.pt === el.getAttribute('data-v')) {
    j.sel.classList.remove('na-sel'); j.sel.classList.add('na-certa'); el.classList.add('na-certa'); j.sel = null; j.acertos++;
    if (j.acertos === j.total) {
      var pts = Math.max(0, j.total * 20 - j.erros * 5);
      $('jogo-res').innerHTML = '<b>Muito bem!</b> Você fez ' + pts + ' pontos. <button class="na-btn na-sm" data-go="jogos/match">Jogar de novo</button>';
      api('jogo.registrar', { tipo: 'match', pontos: pts }).catch(function () {});
    }
  } else { j.erros++; el.classList.add('na-errada'); setTimeout(function () { el.classList.remove('na-errada'); }, 500); }
};

function jogoFrase(g) {
  if (!g.frases.length) { pintar('<h1>Sentence Builder</h1><div class="na-vazio">Ainda não há frases de exemplo cadastradas.</div>'); return; }
  S.jogo = { frases: g.frases, i: 0, pontos: 0 };
  desenharFrase();
}
function desenharFrase() {
  var j = S.jogo, f = j.frases[j.i], palavras = f.frase.replace(/[.!?]$/, '').split(/\s+/);
  j.alvo = palavras.join(' '); j.mont = [];
  var emb = palavras.map(function (w, i) { return { w: w, i: i }; }).sort(function () { return Math.random() - 0.5; });
  pintar('<h1>Sentence Builder</h1><p class="na-mut">Frase ' + (j.i + 1) + ' de ' + j.frases.length + '. Monte a frase na ordem certa. Dica: ' + h(f.traducao) + '</p><div class="na-card"><div class="na-montada" id="fr-mont" aria-live="polite"></div><div class="na-pecas" id="fr-pecas">' + emb.map(function (x) { return '<button class="na-peca" data-act="fraseAdd" data-i="' + x.i + '" data-w="' + h(x.w) + '">' + h(x.w) + '</button>'; }).join('') + '</div><div class="na-linha"><button class="na-btn" data-act="fraseOk">Verificar</button><button class="na-btn na-claro" data-act="fraseLimpar">Limpar</button></div><p id="jogo-res"></p></div>');
}
ACOES.fraseAdd = function (el) {
  if (el.disabled) return;

  S.jogo.mont.push(el.getAttribute('data-w'));

ACOES.fraseLimpar = function () { desenharFrase(); };
ACOES.fraseOk = function () {

  api('jogo.registrar', { tipo: 'frase', pontos: j.pontos }).catch(function () {});

ACOES.gravar = function () {
  var b = $('grav-btn'), st = $('grav-st');
  if (S.gravador && S.gravador.state === 'recording') { S.gravador.stop(); return; }
  if (!(navigator.mediaDevices && window.MediaRecorder)) { toast('Este navegador não grava áudio.'); return; }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
    var partes = [], rec = new MediaRecorder(stream), seg = 0;
    S.gravador = rec;
    rec.ondataavailable = function (e) { if (e.data.size) partes.push(e.data); };
    var cron = setInterval(function () { seg++; st.textContent = seg + 's'; if (seg >= 60 && rec.state === 'recording') rec.stop(); }, 1000);
    rec.onstop = function () {
      clearInterval(cron);
      stream.getTracks().forEach(function (t) { t.stop(); });
      var blob = new Blob(partes, { type: rec.mimeType || 'audio/webm' });
      S.gravado = blob;
      var pv = $('grav-prev'); pv.src = URL.createObjectURL(blob); pv.hidden = false;
      b.textContent = '🎙️ Gravar de novo'; st.textContent = 'Áudio pronto (' + seg + 's)';
    };
    rec.start();
    b.textContent = '⏹ Parar'; st.textContent = '0s';
  }).catch(function () { toast('Microfone bloqueado. Libere nas permissões do navegador.'); });
};

    html += '<div class="na-card"><form data-form="resposta"><input type="hidden" name="postId" value="' + h(p.ID) + '"><label for="f-texto">Sua resposta</label><textarea id="f-texto" name="texto" maxlength="600" required></textarea><p></p><button class="na-btn" type="submit">Responder</button></form></div>';
    pintar(html);
  });
};
FORMS.resposta = function (d) { return api('com.responder', d).then(function () { toast('Resposta enviada.'); navegar(); }); };
ACOES.curtir = function (el) { api('com.curtir', { postId: el.getAttribute('data-id') }).then(function () { navegar(); }).catch(function (e) { toast(e.message); }); };
ACOES.excluirTopico = function (el) {
  if (!window.confirm('Excluir este tópico?')) return;
  api('com.excluir', { ID: el.getAttribute('data-id') }).then(function () { toast('Tópico excluído.'); ir('comunidade'); }).catch(function (e) { toast(e.message); });
};
ACOES.excluirResposta = function (el) {
  if (!window.confirm('Excluir esta resposta?')) return;
  api('com.excluir', { ID: el.getAttribute('data-id'), resposta: true }).then(function () { navegar(); }).catch(function (e) { toast(e.message); });
};

function slotLinha(s, acao) {
  return '<div class="na-linha" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)"><span><b>' + diaSemana(s.Inicio) + ' ' + fmtLocal(s.Inicio) + '</b> &ndash; ' + String(s.Fim).slice(11) + ' <span class="na-selo ' + (s.Tipo === 'duvidas' ? 'na-cinza' : '') + '">' + (s.Tipo === 'duvidas' ? 'tira-dúvidas' : 'conversação') + '</span>' + (s.AlunoNome ? ' <small class="na-mut">com ' + h(s.AlunoNome) + '</small>' : '') + (s.ProfessorNome && acao.indexOf('aluno') === 0 ? ' <small class="na-mut">prof. ' + h(s.ProfessorNome) + '</small>' : '') + (s.Obs ? '<br><small class="na-mut">' + h(s.Obs) + '</small>' : '') + '</span><span>' + acao.replace(/^aluno|^prof/, '') + '</span></div>';
}

T.agenda = function () {
  if (S.user.perfil === 'ALUNO') return Promise.all([api('agenda.minhas'), api('agenda.livres')]).then(function (r) {
    var html = '<h1>Agenda</h1><p class="na-mut">Reserve aulas de conversação e tira-dúvidas com o seu professor.</p><div class="na-grade"><div class="na-card"><h2>Minhas aulas</h2>';
    html += r[0].length ? r[0].map(function (s) { return slotLinha(s, 'aluno<button class="na-btn na-sm na-claro" data-act="cancelarAula" data-id="' + h(s.ID) + '">Cancelar</button>'); }).join('') : '<div class="na-vazio">Nenhuma aula reservada.</div>';
    html += '</div><div class="na-card"><h2>Horários livres</h2>';
    html += r[1].length ? r[1].map(function (s) { return slotLinha(s, 'aluno<button class="na-btn na-sm" data-act="reservarAula" data-id="' + h(s.ID) + '">Reservar</button>'); }).join('') : '<div class="na-vazio">Nenhum horário livre agora. Volte mais tarde.</div>';
    pintar(html + '</div></div>');
  });
  return api('agenda.profLista').then(function (ls) {
    var html = '<h1>Agenda</h1><p class="na-mut">Disponibilize horários para conversação avançada e tira-dúvidas.</p><div class="na-grade"><div class="na-card"><h2>Novo horário</h2><form data-form="slot">' + campo('Data e hora', 'inicio', '', 'datetime-local', 'required') + seletor('Duração', 'duracao', [['15', '15 min'], ['30', '30 min'], ['45', '45 min'], ['60', '60 min']], '30') + seletor('Tipo', 'tipo', [['conversacao', 'Conversação avançada'], ['duvidas', 'Tira-dúvidas']], 'conversacao') + seletor('Repetir toda semana por', 'semanas', [['1', 'só este dia'], ['2', '2 semanas'], ['4', '4 semanas'], ['8', '8 semanas']], '1') + campo('Observação (opcional)', 'obs', '', 'text', 'maxlength="200"') + '<p></p><button class="na-btn" type="submit">Disponibilizar</button></form></div><div class="na-card"><h2>Meus horários</h2>';
    html += ls.length ? ls.map(function (s) { return slotLinha(s, 'prof' + (s.Status === 'RESERVADA' ? '<span class="na-selo na-ok">reservada</span> <button class="na-btn na-sm na-claro" data-act="cancelarAula" data-id="' + h(s.ID) + '">Liberar</button>' : '<span class="na-selo na-cinza">livre</span> <button class="na-btn na-sm na-perigo" data-act="excluirSlot" data-id="' + h(s.ID) + '">Excluir</button>')); }).join('') : '<div class="na-vazio">Nenhum horário cadastrado.</div>';
    pintar(html + '</div></div>');
  });
};
FORMS.slot = function (d) { return api('agenda.criar', { inicio: d.inicio, duracao: Number(d.duracao), tipo: d.tipo, semanas: Number(d.semanas), obs: d.obs }).then(function (r) { toast(r.criados + ' horário(s) criado(s).'); navegar(); }); };
ACOES.excluirSlot = function (el) { api('agenda.excluir', { ID: el.getAttribute('data-id') }).then(function () { navegar(); }).catch(function (e) { toast(e.message); }); };
ACOES.reservarAula = function (el) { api('agenda.reservar', { ID: el.getAttribute('data-id') }).then(function () { toast('Aula reservada!'); navegar(); }).catch(function (e) { toast(e.message); navegar(); }); };
ACOES.cancelarAula = function (el) {
  if (!window.confirm('Liberar este horário?')) return;
  api('agenda.cancelar', { ID: el.getAttribute('data-id') }).then(function () { navegar(); }).catch(function (e) { toast(e.message); });
};

T.recados = function () {
  return api('aluno.recados').then(function (ls) {
    var html = '<h1>Recados</h1><p class="na-mut">Mensagens do seu professor.</p>';
    if (!ls.length) html += '<div class="na-card na-vazio">Nenhum recado por enquanto.</div>';
    ls.forEach(function (r) {
      html += '<div class="na-card' + (r.Lido ? '' : ' na-ouro') + '"><small>' + h(r.ProfessorNome) + ' &middot; ' + fmtLocal(r.Quando) + (r.Lido ? '' : ' &middot; novo') + '</small>' + (r.Texto ? '<p style="margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere">' + h(r.Texto) + '</p>' : '') + '<div class="na-linha">' + (r.temAudio ? '<button class="na-btn na-sm" data-act="tocarRecado" data-id="' + h(r.ID) + '">&#9658; Ouvir áudio</button>' : '') + (!r.Lido && !r.temAudio ? '<button class="na-btn na-sm na-claro" data-act="lerRecado" data-id="' + h(r.ID) + '">Marcar como lido</button>' : '') + '</div></div>';
    });
    pintar(html);
  });
};
ACOES.lerRecado = function (el) { api('aluno.recadoLer', { ID: el.getAttribute('data-id') }).then(function () { S.user.recados = Math.max(0, (S.user.recados || 1) - 1); atualizarChip(); navegar(); }); };
ACOES.tocarRecado = function (el) {
  api('aluno.recadoAudio', { ID: el.getAttribute('data-id') }).then(function (r) {
    var bin = atob(r.audio), bytes = new Uint8Array(bin.length), i;
    for (i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var a = new Audio(URL.createObjectURL(new Blob([bytes], { type: r.mime })));
    a.play().catch(function () { toast('Não foi possível tocar o áudio.'); });
    S.user.recados = Math.max(0, (S.user.recados || 1) - 1); atualizarChip();
  }).catch(function (e) { toast(e.message); });
};

T.suporte = function () {
  var m = S.marca;
  pintar('<h1>Suporte</h1><div class="na-card"><p>' + h(m.SUPORTE_TEXTO) + '</p>' + (m.SUPORTE_WHATSAPP ? '<a class="na-btn" href="' + h(m.SUPORTE_WHATSAPP) + '" target="_blank" rel="noopener">Falar pelo WhatsApp</a>' : '<p class="na-mut">O contato da escola ainda não foi configurado.</p>') + '</div><div class="na-card"><h2>Dúvidas rápidas</h2><p><b>O microfone não funciona.</b><br>Libere o microfone nas permissões do navegador para este site e teste em Meu perfil.</p><p><b>Quantas vezes posso usar a IA por dia?</b><br>Há um limite diário por aluno. Ele aparece no seu painel.</p><p><b>Como o professor acompanha meu progresso?</b><br>O Nice AI gera um relatório semanal com seus pontos fortes e erros mais comuns.</p><button class="na-btn na-claro" data-go="perfil">Meu perfil</button></div>');
};
